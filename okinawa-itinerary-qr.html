<style>
  :root { --ivory:#FAF9F5; --slate:#141413; --clay:#A5502F; --muted:#5E5D59; --purple:#692A68; --rule:rgba(31,30,29,.15); }
  * { box-sizing:border-box; margin:0; }
  body { background:#F0EEE6; color:var(--slate); font-family:"Noto Sans KR",system-ui,sans-serif;
         min-height:100vh; word-break:keep-all; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:560px; background:var(--ivory); border-radius:20px;
          box-shadow:0 10px 40px rgba(20,20,19,.08); padding:44px 40px 36px; }
  .top { display:flex; justify-content:space-between; align-items:center; padding-bottom:18px; border-bottom:1px solid var(--rule); }
  .date { color:var(--clay); font-weight:700; font-size:15px; letter-spacing:.02em; }
  .badge { background:var(--clay); color:var(--ivory); font-weight:700; font-size:13px; padding:5px 14px; border-radius:999px; }
  h1 { font-family:"Noto Serif KR",serif; font-weight:400; font-size:40px; margin-top:26px; line-height:1.2; }
  .sub { color:var(--muted); font-size:17px; margin-top:6px; }
  .qr { display:block; margin:32px auto 0; width:min(78%,360px); padding:24px; border:1px solid var(--rule); }
  .qr svg { display:block; width:100%; height:auto; }
  .hint { font-size:16px; margin-top:32px; }
  .label { color:var(--clay); font-weight:700; font-size:12px; letter-spacing:.06em; margin-top:16px; }
  .link { display:inline-block; color:var(--purple); font-weight:700; font-size:19px; margin-top:4px;
          text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:2px; }
  .link:hover { opacity:.8; }
  .foot { color:var(--muted); font-size:13px; margin-top:22px; padding-top:16px; border-top:1px solid var(--rule); }
  @media (max-width:420px) { .card { padding:32px 22px 28px; } h1 { font-size:32px; } .sub { font-size:15px; } .qr { width:88%; padding:16px; } }
</style>
